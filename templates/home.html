{% extends "base.html" %}
{% block title %}Welcome — Soko Letu{% endblock %}
{% block content %}
<div class="hero">
    <h1>Welcome to Soko Letu</h1>
    <p class="lead">Many shops, many products — all in one place.</p>
    <a href="{% url 'product_list' %}" class="btn btn-primary">Browse Products</a>
    {% if not user.is_authenticated %}
        <a href="{% url 'register_seller' %}" class="btn">Become a Seller</a>
    {% endif %}
</div>
{% endblock %}
