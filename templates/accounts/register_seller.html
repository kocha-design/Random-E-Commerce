{% extends "base.html" %}
{% block title %}Sign Up as Seller{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Sign Up as Seller</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <p class="auth-footer">Are you a customer? <a href="{% url 'register_customer' %}">Click here</a></p>
</div>
{% endblock %}
